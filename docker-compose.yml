version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: pfm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     pfm_user
      POSTGRES_PASSWORD: pfm_pass
      POSTGRES_DB:       pfm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm_user -d pfm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: pfm_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://pfm_user:pfm_pass@db:5432/pfm_db
    volumes:
      - ./backend:/app
      - ./db:/app/../db:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pfm_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
    name: pfm_postgres_data
